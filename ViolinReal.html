<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Violin Real</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;
  background:#0a0a0a;font-family:Georgia,'Times New Roman',serif;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;position:relative;overflow:hidden;}
#bgCv{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;pointer-events:none;}

/* Header */
#hd{display:flex;align-items:center;justify-content:space-between;
  padding:3px 8px;min-height:24px;z-index:5;position:relative;
  background:linear-gradient(180deg,rgba(140,105,60,.45),rgba(100,70,35,.3));
  border-bottom:1px solid rgba(0,0,0,.3);}
#hd h1{font-size:11px;color:#3d2010;letter-spacing:2px;font-weight:700;
  text-shadow:0 1px 0 rgba(255,255,255,.15);}

/* Fingerboard zone */
#fb{flex:0 0 auto;position:relative;z-index:3;padding:2px 0 4px 0;
  display:flex;flex-direction:row;align-items:stretch;}

/* Open string buttons — LEFT column inside fingerboard */
#osCol{display:flex;flex-direction:column;gap:1px;padding:0 2px;
  justify-content:space-around;flex:0 0 auto;width:15%;min-width:44px;
  position:relative;z-index:3;}
.ob{flex:1;max-height:48px;border-radius:10px;border:2px solid;
  background:rgba(10,8,5,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:bold;cursor:pointer;
  transition:transform .08s;margin:1px 0;}
.ob:active,.ob.on{transform:scale(.92);background:rgba(255,255,255,.1);}
.ob[data-i="0"]{border-color:#44ee44;color:#44ee44;}
.ob[data-i="1"]{border-color:#cc55ff;color:#cc55ff;}
.ob[data-i="2"]{border-color:#44ddee;color:#44ddee;}
.ob[data-i="3"]{border-color:#ffdd33;color:#ffdd33;}

/* Note grid — right portion */
#noteArea{flex:1;display:flex;flex-direction:column;position:relative;z-index:2;}
#shdr{display:flex;margin-bottom:1px;padding:0 2px;}
.sh{flex:1;text-align:center;font-size:10px;font-weight:bold;padding:1px 0;
  text-shadow:0 0 8px currentColor,0 1px 3px rgba(0,0,0,.8);}
#ng{display:flex;flex-direction:column;gap:2px;padding:0 2px;}
.nr{display:flex;gap:2px;}
.nb{flex:1;height:28px;border-radius:14px;
  background:rgba(255,250,235,.1);
  border:1px solid rgba(200,190,160,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:rgba(240,230,200,.78);
  text-shadow:0 1px 3px rgba(0,0,0,.8);
  cursor:pointer;transition:transform .06s,background .06s;min-width:0;}
.nb:active,.nb.on{transform:scale(.94);
  background:rgba(255,215,0,.3);border-color:rgba(255,215,0,.45);
  color:#fff;box-shadow:0 0 10px rgba(255,215,0,.25);}

/* Bow zone — COMPLETELY clear for dragging */
#bz{flex:1;position:relative;z-index:2;min-height:180px;overflow:hidden;}
#bowCv{display:block;width:100%;height:100%;position:relative;z-index:1;touch-action:none;}

#nd{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:8;
  font-size:22px;font-weight:bold;color:#ffd700;
  text-shadow:0 0 14px rgba(255,215,0,.6),0 2px 4px rgba(0,0,0,.6);
  pointer-events:none;}
#logo{position:absolute;bottom:3px;right:8px;z-index:6;
  font-size:11px;font-weight:bold;color:rgba(255,255,255,.1);
  letter-spacing:2px;font-style:italic;pointer-events:none;}

#ov{position:absolute;inset:0;z-index:50;background:rgba(10,8,6,.88);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(3px);}
#ov .i{text-align:center;animation:pu 2s ease-in-out infinite;}
@keyframes pu{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
.H{display:none!important;}

/* ─── Toolbar (mode, metronome, vibrato, settings) ─── */
#tb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:3px 6px;min-height:26px;z-index:7;position:relative;
  background:linear-gradient(180deg,rgba(60,40,20,.6),rgba(35,22,10,.75));
  border-bottom:1px solid rgba(0,0,0,.45);font-family:Georgia,serif;}
.tbtn{padding:3px 8px;font-size:10px;font-weight:700;border-radius:10px;
  color:#c9a96e;background:rgba(20,14,8,.55);
  border:1px solid rgba(201,169,110,.35);cursor:pointer;letter-spacing:.5px;
  transition:all .1s;user-select:none;-webkit-user-select:none;}
.tbtn:active{transform:scale(.94);}
.tbtn.on{background:linear-gradient(180deg,#c9a96e,#8b6a3c);color:#1a0e05;
  border-color:#f0d890;box-shadow:0 0 8px rgba(201,169,110,.4);}
.tbtn.sm{padding:2px 6px;font-size:9px;}
#tbSpacer{flex:1;}
#tbMetro{display:flex;align-items:center;gap:2px;}
#tbMetro .bpmVal{font-size:11px;color:#f0d890;min-width:26px;text-align:center;font-weight:700;}
#tbStats{font-size:9px;color:rgba(201,169,110,.7);letter-spacing:.5px;}

/* ─── Song mode overlay (falling notes + HUD) ─── */
#songHud{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;
  font-family:Georgia,serif;color:#f0d890;}
#songTitle{padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:1px;
  text-shadow:0 1px 3px rgba(0,0,0,.8);}
#songScore{padding:2px 8px;font-size:9px;color:rgba(240,216,144,.8);}
#songStreak{color:#ffd700;}

/* ─── Tuner mode overlay ─── */
#tunerHud{position:absolute;inset:0;z-index:6;pointer-events:none;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  font-family:Georgia,serif;color:#c9a96e;}
#tunerHud.on{display:flex;pointer-events:auto;}
#tunerRow{display:flex;gap:8px;margin-top:10px;pointer-events:auto;}
.tunerBtn{width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:14px;font-weight:900;cursor:pointer;
  background:rgba(20,14,8,.7);border:2px solid;transition:transform .1s;}
.tunerBtn:active{transform:scale(.92);}
.tunerBtn .hz{font-size:8px;opacity:.65;margin-top:2px;font-weight:400;}
#tunerTitle{font-size:14px;letter-spacing:3px;margin-bottom:6px;}
#tunerNote{font-size:56px;font-weight:900;text-shadow:0 0 20px rgba(255,215,0,.4);}
#tunerCents{font-size:11px;margin-top:3px;}

/* ─── Settings panel ─── */
#setP{position:absolute;top:52px;right:6px;z-index:40;
  background:linear-gradient(180deg,rgba(40,28,14,.95),rgba(22,14,6,.97));
  border:1px solid rgba(201,169,110,.4);border-radius:10px;
  padding:10px 12px;min-width:180px;display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.6);font-family:Georgia,serif;color:#c9a96e;}
#setP.on{display:block;}
#setP h3{font-size:11px;letter-spacing:2px;margin-bottom:8px;color:#f0d890;border-bottom:1px solid rgba(201,169,110,.25);padding-bottom:4px;}
#setP .row{display:flex;justify-content:space-between;align-items:center;margin:5px 0;font-size:10px;}
#setP .row label{font-weight:700;}
#setP .row .val{color:#f0d890;}
#setP button{padding:3px 8px;font-size:9px;border-radius:6px;
  background:rgba(20,14,8,.55);color:#c9a96e;
  border:1px solid rgba(201,169,110,.35);cursor:pointer;}

/* ─── Toast (feedback messages) ─── */
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);
  z-index:45;padding:6px 14px;background:rgba(20,14,8,.9);
  border:1px solid rgba(201,169,110,.5);border-radius:14px;
  color:#f0d890;font-size:11px;font-weight:700;letter-spacing:1px;
  pointer-events:none;opacity:0;transition:opacity .25s;font-family:Georgia,serif;}
#toast.on{opacity:1;}
</style>

<script>
/* ═══ AUDIO — Pure Synth Violin Engine (Offline, No External Samples) ═══
   • 14 harmonics with violin spectrum
   • 5-formant body resonance bank (Helmholtz 280, air 460, wood 710, 1250, bridge-hill 2800)
   • Rosin bow-noise layer (bandpassed noise, velocity-scaled)
   • Sawtooth/triangle harmonic mix for bowed-string timbre
   • Vibrato LFO (5.8 Hz) with per-voice depth control
   • Dual-tap feedback reverb
   • Metronome click + tuner reference-tone helpers
*/
const AE=(()=>{
  let c=null,m=null,body=null,wnBuf=null;
  const v={};
  const BF=[196,293.66,440,659.25];
  const NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  // Real-violin harmonic spectrum (normalized, 14 partials)
  const HH=[1,.82,.65,.55,.42,.33,.26,.20,.16,.12,.09,.07,.05,.04];
  const VIB_RATE=5.8, VIB_DEPTH_CENTS=22;

  function makeNoise(){
    const sr=c.sampleRate;
    const b=c.createBuffer(1,sr*2,sr);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    return b;
  }

  function init(){
    c=new(window.AudioContext||window.webkitAudioContext)();
    m=c.createGain();m.gain.value=.55;
    // ── Body resonance formant chain ──
    body=c.createGain();body.gain.value=1;
    const f1=c.createBiquadFilter();f1.type='peaking';f1.frequency.value=280;f1.Q.value=4.0;f1.gain.value=6;
    const f2=c.createBiquadFilter();f2.type='peaking';f2.frequency.value=460;f2.Q.value=4.5;f2.gain.value=5;
    const f3=c.createBiquadFilter();f3.type='peaking';f3.frequency.value=710;f3.Q.value=5.0;f3.gain.value=4;
    const f4=c.createBiquadFilter();f4.type='peaking';f4.frequency.value=1250;f4.Q.value=3.0;f4.gain.value=3;
    const f5=c.createBiquadFilter();f5.type='peaking';f5.frequency.value=2800;f5.Q.value=2.2;f5.gain.value=3.5;
    const shelf=c.createBiquadFilter();shelf.type='highshelf';shelf.frequency.value=5200;shelf.gain.value=-4;
    body.connect(f1);f1.connect(f2);f2.connect(f3);f3.connect(f4);f4.connect(f5);f5.connect(shelf);shelf.connect(m);
    // ── Dual-tap feedback reverb ──
    const dry=c.createGain();dry.gain.value=.78;
    const wet=c.createGain();wet.gain.value=.22;
    const dl1=c.createDelay(1);dl1.delayTime.value=.029;
    const dl2=c.createDelay(1);dl2.delayTime.value=.051;
    const fb=c.createGain();fb.gain.value=.24;
    const rl=c.createBiquadFilter();rl.type='lowpass';rl.frequency.value=3000;
    m.connect(dry);dry.connect(c.destination);
    m.connect(dl1);dl1.connect(rl);rl.connect(dl2);dl2.connect(fb);fb.connect(dl1);dl2.connect(wet);wet.connect(c.destination);
    wnBuf=makeNoise();
  }
  function res(){if(c&&c.state==='suspended')c.resume();}
  function freq(s,sm){return BF[s]*Math.pow(2,sm/12);}
  function nn(f){const mi=Math.round(12*Math.log2(f/440)+69);return NN[((mi%12)+12)%12]+Math.floor(mi/12-1);}

  function play(si,sm,vel,vibAmt){
    if(!c)return;res();stop(si);
    const f0=freq(si,sm);
    const vv=Math.min(.85,Math.max(.08,vel));
    const t=c.currentTime;
    const mx=c.createGain();mx.gain.value=.5;
    // Harmonic oscillators (alt sawtooth/triangle for bowed timbre)
    const os=[],oG=[];
    for(let h=0;h<HH.length;h++){
      const hf=f0*(h+1);
      if(hf>c.sampleRate/2)break;
      const o=c.createOscillator();
      o.type=(h%2===0?'sawtooth':'triangle');
      o.frequency.value=hf;
      const g=c.createGain();g.gain.value=HH[h];
      o.connect(g);g.connect(mx);
      o.start(t);os.push(o);oG.push(g);
    }
    // Vibrato LFO → detunes every partial
    const vibLfo=c.createOscillator();vibLfo.type='sine';vibLfo.frequency.value=VIB_RATE;
    const vibG=c.createGain();vibG.gain.value=(vibAmt||0)*VIB_DEPTH_CENTS;
    vibLfo.connect(vibG);
    os.forEach(o=>vibG.connect(o.detune));
    vibLfo.start(t);
    // Rosin bow-noise layer
    const noise=c.createBufferSource();noise.buffer=wnBuf;noise.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2500;bp.Q.value=1.2;
    const nGain=c.createGain();nGain.gain.value=0;
    noise.connect(bp);bp.connect(nGain);nGain.connect(mx);
    noise.start(t);
    // Amplitude envelope (slow attack = bowed)
    const eg=c.createGain();
    eg.gain.setValueAtTime(0,t);
    eg.gain.linearRampToValueAtTime(vv*.55,t+.07);
    eg.gain.linearRampToValueAtTime(vv*.42,t+.22);
    mx.connect(eg);eg.connect(body);
    // Bow-noise velocity scaling
    nGain.gain.setValueAtTime(0,t);
    nGain.gain.linearRampToValueAtTime(vv*.10,t+.05);
    v[si]={os,oG,mx,eg,vibLfo,vibG,noise,bp,nGain,f0};
    return nn(f0);
  }

  function upd(si,sm,vel,vibAmt){
    const vo=v[si];if(!vo||!c)return;
    const f0=freq(si,sm);
    const vv=Math.min(.85,Math.max(.08,vel));
    const t=c.currentTime;
    vo.os.forEach((o,h)=>o.frequency.linearRampToValueAtTime(f0*(h+1),t+.025));
    vo.eg.gain.linearRampToValueAtTime(vv*.42,t+.03);
    vo.nGain.gain.linearRampToValueAtTime(vv*.10,t+.04);
    if(vo.vibG)vo.vibG.gain.linearRampToValueAtTime((vibAmt||0)*VIB_DEPTH_CENTS,t+.05);
    vo.f0=f0;
    return nn(f0);
  }

  function stop(si){
    const vo=v[si];if(!vo||!c)return;const t=c.currentTime;
    vo.eg.gain.cancelScheduledValues(t);vo.eg.gain.setValueAtTime(vo.eg.gain.value,t);
    vo.eg.gain.linearRampToValueAtTime(0,t+.15);
    vo.nGain.gain.cancelScheduledValues(t);vo.nGain.gain.linearRampToValueAtTime(0,t+.12);
    setTimeout(()=>{
      try{
        vo.os.forEach(o=>{try{o.stop()}catch(e){}});
        try{vo.vibLfo.stop()}catch(e){}
        try{vo.noise.stop()}catch(e){}
        [vo.mx,...vo.oG,vo.bp,vo.nGain,vo.eg,vo.vibG].forEach(n=>{try{n.disconnect()}catch(e){}});
      }catch(e){}
    },230);delete v[si];
  }
  function stopAll(){for(let i=0;i<4;i++)stop(i);}

  // Metronome click (sine blip, accent = higher pitch + louder)
  function click(accent){
    if(!c)return;res();
    const t=c.currentTime;
    const o=c.createOscillator();o.type='sine';o.frequency.value=accent?1800:1200;
    const g=c.createGain();g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(accent?.35:.22,t+.002);
    g.gain.exponentialRampToValueAtTime(.0001,t+.08);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+.1);
  }

  // Tuner reference tone
  function tone(hz,ms){
    if(!c)return;res();
    const t=c.currentTime;const dur=ms/1000;
    const o=c.createOscillator();o.type='sine';o.frequency.value=hz;
    const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=hz*2;
    const g=c.createGain();g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.28,t+.05);
    g.gain.linearRampToValueAtTime(.22,t+Math.max(.1,dur-.15));
    g.gain.linearRampToValueAtTime(0,t+dur);
    const g2=c.createGain();g2.gain.value=.15;
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(c.destination);
    o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
  }

  function setMaster(v){if(m)m.gain.value=Math.max(0,Math.min(1,v));}
  return{init,res,freq,nn,play,upd,stop,stopAll,click,tone,setMaster,BF,get loaded(){return true}};
})();

/* ═══ STATE ═══ */
const SC=['#44ee44','#cc55ff','#44ddee','#ffdd33'];
const SCA=['rgba(68,238,68,','rgba(204,85,255,','rgba(68,221,238,','rgba(255,221,51,'];
const SD=['rgba(68,238,68,.22)','rgba(204,85,255,.22)','rgba(68,221,238,.22)','rgba(255,221,51,.22)'];
const SN=['G3','D4','A4','E5'];
const SEMI=7;
let audioOn=false,semi=[0,0,0,0],actS=-1,curN='';
let bow={dn:false,px:0,py:0,lx:0,lt:0,spd:0,dir:1,str:-1,angle:-Math.PI*.22};
let vib=[0,0,0,0],vibP=[0,0,0,0],parts=[];
let totalW=0,totalH=0,dpr=1,fbTop=0,fbBot=0;
// osColWidth — how much the open string column takes
let osW=0;

/* ─── New: mode / metronome / tuner / vibrato / stats state ─── */
let mode='freeplay'; // freeplay | song | tuner
let vibManual=0;     // manual vibrato depth 0..1 (toolbar toggle)
let metroOn=false, metroBPM=90, metroBeat=0, metroAcc=1/*beats per bar accent*/, metroNextT=0;
let tunerHz=0, tunerCents=0; // tuner-mode analyzer read
let analyser=null, analyserBuf=null;
let stats={plays:0, sessionStart:Date.now(), bestStreak:0, curStreak:0};
let songState=null; // populated when entering song mode
let showSongHint=false;

/* String X = note grid area, matching note buttons */
function strX(i){
  // Note grid starts after osCol (15% or 44px min)
  // Within the note grid, 4 columns evenly spaced
  const gridL=osW+4; // left edge of note grid
  const gridR=totalW-4;
  const gridW=gridR-gridL;
  return gridL+gridW*((i+.5)/4);
}

/* ═══ BUILD UI ═══ */
function buildFB(){
  const hdr=document.getElementById('shdr'),grid=document.getElementById('ng');
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='sh';d.textContent=SN[i];d.style.color=SC[i];hdr.appendChild(d);}
  for(let sm=1;sm<=SEMI;sm++){
    const row=document.createElement('div');row.className='nr';
    for(let si=0;si<4;si++){
      const b=document.createElement('div');b.className='nb';
      b.textContent=AE.nn(AE.freq(si,sm));b.dataset.s=si;b.dataset.m=sm;
      b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureA();pickNote(si,sm);b.classList.add('on');});
      b.addEventListener('pointerup',()=>b.classList.remove('on'));
      b.addEventListener('pointerleave',()=>b.classList.remove('on'));
      row.appendChild(b);
    }grid.appendChild(row);
  }
}
function buildOS(){
  const c=document.getElementById('osCol');
  for(let i=0;i<4;i++){
    const b=document.createElement('div');b.className='ob';b.dataset.i=i;b.textContent=SN[i];
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureA();pickNote(i,0);b.classList.add('on');});
    b.addEventListener('pointerup',()=>b.classList.remove('on'));
    b.addEventListener('pointerleave',()=>b.classList.remove('on'));
    c.appendChild(b);
  }
}
function pickNote(si,sm){
  semi[si]=sm;
  curN=sm===0?SN[si]:AE.nn(AE.freq(si,sm));
  if(bow.dn&&bow.str===si)AE.upd(si,sm,bow.spd,vibManual);
  // Song mode: check if this note matches the active target row
  if(mode==='song'&&songState)songTryHit(si,sm);
}

/* ═══ BACKGROUND — Real Violin Shape ═══ */
const bgCv=document.getElementById('bgCv'),bg=bgCv.getContext('2d');

function drawBG(){
  const W=totalW,H=totalH;
  bg.clearRect(0,0,W,H);

  // ── Wood side panels ──
  const wg=bg.createLinearGradient(0,0,W,0);
  wg.addColorStop(0,'#c4a06a');wg.addColorStop(.25,'#b8935a');
  wg.addColorStop(.75,'#b8935a');wg.addColorStop(1,'#c4a06a');
  bg.fillStyle=wg;bg.fillRect(0,0,W,H);
  bg.save();bg.globalAlpha=.06;
  for(let i=0;i<W;i+=11){bg.strokeStyle='#7a5020';bg.lineWidth=.6;bg.beginPath();bg.moveTo(i,0);bg.lineTo(i+3,H);bg.stroke();}
  bg.restore();

  // ── Center axis of strings (shifted right to match grid) ──
  const cx=(strX(0)+strX(3))/2;
  const strSpread=(strX(3)-strX(0))/2;

  // ── EBONY FINGERBOARD ──
  const fbW=strSpread*1.6;
  bg.save();
  bg.beginPath();
  bg.moveTo(cx-fbW*.9,fbTop);bg.lineTo(cx+fbW*.9,fbTop);
  bg.lineTo(cx+fbW*1.1,fbBot+8);bg.lineTo(cx-fbW*1.1,fbBot+8);
  bg.closePath();bg.clip();
  const ebG=bg.createLinearGradient(0,fbTop,0,fbBot+8);
  ebG.addColorStop(0,'#080810');ebG.addColorStop(.3,'#0c0c14');ebG.addColorStop(.7,'#0e0e16');ebG.addColorStop(1,'#0a0a12');
  bg.fillStyle=ebG;bg.fillRect(0,fbTop-2,W,fbBot-fbTop+12);
  // Ebony grain
  bg.globalAlpha=.04;
  for(let y=fbTop;y<fbBot+8;y+=3){bg.strokeStyle=Math.random()>.5?'#2a2a35':'#15151e';bg.lineWidth=.3+Math.random()*.3;
    bg.beginPath();bg.moveTo(0,y+Math.random()*2);bg.lineTo(W,y+Math.random()*2);bg.stroke();}
  bg.globalAlpha=1;
  // Gloss
  const gl=bg.createLinearGradient(cx-fbW,0,cx+fbW,0);
  gl.addColorStop(0,'rgba(255,255,255,0)');gl.addColorStop(.4,'rgba(255,255,255,.025)');
  gl.addColorStop(.6,'rgba(255,255,255,.025)');gl.addColorStop(1,'rgba(255,255,255,0)');
  bg.fillStyle=gl;bg.fillRect(0,fbTop,W,fbBot-fbTop+8);
  bg.restore();

  // Maple neck edges
  bg.fillStyle='#a88050';
  bg.fillRect(cx-fbW*1.1-6,fbTop,6,fbBot-fbTop+8);
  bg.fillRect(cx+fbW*1.1,fbTop,6,fbBot-fbTop+8);

  // Nut
  bg.fillStyle='#e8dcc0';
  bg.fillRect(cx-fbW*.9,fbTop,fbW*1.8,3);

  // ── VIOLIN BODY (proper shape, centered on strings) ──
  const bodyTop=fbBot+20;
  const bodyBot=H-8;
  const bodyH=bodyBot-bodyTop;
  const bodyMid=bodyTop+bodyH*.5;
  const bw=strSpread*2.2; // body half-width

  bg.save();
  bg.beginPath();
  // Upper bout (shoulders)
  bg.moveTo(cx,bodyTop);
  bg.bezierCurveTo(cx+bw*.55,bodyTop, cx+bw*.85,bodyTop+bodyH*.08, cx+bw*.8,bodyTop+bodyH*.2);
  // C-bout (waist) right
  bg.bezierCurveTo(cx+bw*.7,bodyTop+bodyH*.32, cx+bw*.5,bodyTop+bodyH*.4, cx+bw*.5,bodyMid);
  bg.bezierCurveTo(cx+bw*.5,bodyTop+bodyH*.6, cx+bw*.7,bodyTop+bodyH*.68, cx+bw*.85,bodyTop+bodyH*.75);
  // Lower bout right
  bg.bezierCurveTo(cx+bw*1.0,bodyTop+bodyH*.85, cx+bw*.7,bodyBot, cx,bodyBot);
  // Lower bout left
  bg.bezierCurveTo(cx-bw*.7,bodyBot, cx-bw*1.0,bodyTop+bodyH*.85, cx-bw*.85,bodyTop+bodyH*.75);
  // C-bout left
  bg.bezierCurveTo(cx-bw*.7,bodyTop+bodyH*.68, cx-bw*.5,bodyTop+bodyH*.6, cx-bw*.5,bodyMid);
  bg.bezierCurveTo(cx-bw*.5,bodyTop+bodyH*.4, cx-bw*.7,bodyTop+bodyH*.32, cx-bw*.8,bodyTop+bodyH*.2);
  // Upper bout left
  bg.bezierCurveTo(cx-bw*.85,bodyTop+bodyH*.08, cx-bw*.55,bodyTop, cx,bodyTop);
  bg.closePath();

  // Body gradient (warm spruce/maple)
  const vbg=bg.createRadialGradient(cx,bodyMid,bw*.15,cx,bodyMid,bw*1.2);
  vbg.addColorStop(0,'#9b6e44');vbg.addColorStop(.2,'#8b5e3c');
  vbg.addColorStop(.45,'#7a4e2d');vbg.addColorStop(.7,'#6b4226');
  vbg.addColorStop(1,'#4a2818');
  bg.fillStyle=vbg;bg.fill();

  // Purfling (thin border line)
  bg.strokeStyle='rgba(30,18,8,.5)';bg.lineWidth=1.5;bg.stroke();

  // Wood grain inside body
  bg.save();bg.clip();bg.globalAlpha=.04;
  for(let i=-bw*1.5;i<bw*1.5;i+=7){bg.strokeStyle='#d8a860';bg.lineWidth=.5;
    bg.beginPath();bg.moveTo(cx+i,bodyTop);bg.lineTo(cx+i+2,bodyBot);bg.stroke();}
  bg.globalAlpha=1;

  // F-holes
  drawFH(bg,cx-bw*.32,bodyMid,bodyH*.22,false);
  drawFH(bg,cx+bw*.32,bodyMid,bodyH*.22,true);

  bg.restore();

  // Bridge
  bg.fillStyle='#e0d0b0';
  const brL=strX(0)-8,brR=strX(3)+8;
  bg.fillRect(brL,bodyMid-bodyH*.04,brR-brL,3.5);
  bg.fillStyle='rgba(0,0,0,.15)';bg.fillRect(brL,bodyMid-bodyH*.04+3.5,brR-brL,1);

  // Tailpiece
  bg.fillStyle='#1a0e06';
  rr(bg,cx-12,bodyMid+bodyH*.3,24,bodyH*.2,5);bg.fill();

  // Chin rest hint
  bg.fillStyle='rgba(10,8,4,.3)';
  bg.beginPath();bg.ellipse(cx-bw*.6,bodyBot-bodyH*.15,bw*.25,bodyH*.12,-.2,0,Math.PI*2);bg.fill();

  // ── STRINGS (continuous, full height) ──
  const sThk=[3.5,2.8,2,1.4];
  for(let i=0;i<4;i++){
    const sx=strX(i);
    const sg=bg.createLinearGradient(sx-2,0,sx+2,0);
    sg.addColorStop(0,'rgba(160,155,140,.2)');sg.addColorStop(.3,'rgba(210,205,190,.35)');
    sg.addColorStop(.5,'rgba(230,225,210,.4)');sg.addColorStop(.7,'rgba(210,205,190,.35)');
    sg.addColorStop(1,'rgba(160,155,140,.2)');
    bg.strokeStyle=sg;bg.lineWidth=sThk[i];
    bg.beginPath();bg.moveTo(sx,0);bg.lineTo(sx,H);bg.stroke();
    bg.strokeStyle='rgba(255,255,250,.06)';bg.lineWidth=sThk[i]*.3;
    bg.beginPath();bg.moveTo(sx-.5,0);bg.lineTo(sx-.5,H);bg.stroke();
  }

  // Fret guides on fingerboard
  [.1,.2,.3,.42,.55,.7,.86].forEach(p=>{
    const y=fbTop+(fbBot-fbTop)*p;
    bg.strokeStyle='rgba(60,55,50,.06)';bg.lineWidth=.5;
    bg.beginPath();bg.moveTo(cx-fbW*1.1,y);bg.lineTo(cx+fbW*1.1,y);bg.stroke();
  });
}

function drawFH(ctx,x,y,h,mir){
  ctx.save();if(mir){ctx.translate(x,y);ctx.scale(-1,1);ctx.translate(-x,-y);}
  // Proper f-hole shape
  ctx.fillStyle='rgba(15,8,3,.6)';ctx.strokeStyle='rgba(35,18,6,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x+1,y-h*.42);
  ctx.bezierCurveTo(x-3,y-h*.25, x-5,y-h*.08, x-4,y+h*.05);
  ctx.bezierCurveTo(x-3,y+h*.15, x-1,y+h*.2, x+1,y+h*.22);
  ctx.bezierCurveTo(x+3,y+h*.24, x+5,y+h*.2, x+4,y+h*.1);
  ctx.bezierCurveTo(x+3,y+h*.02, x+1,y-h*.05, x+2,y-h*.15);
  ctx.bezierCurveTo(x+3,y-h*.28, x+2,y-h*.38, x+1,y-h*.42);
  ctx.fill();ctx.stroke();
  // Upper & lower dots
  ctx.beginPath();ctx.arc(x-1,y-h*.28,2,0,Math.PI*2);ctx.fillStyle='rgba(15,8,3,.7)';ctx.fill();
  ctx.beginPath();ctx.arc(x+2,y+h*.15,2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ═══ BOW CANVAS ═══ */
const bowCv=document.getElementById('bowCv'),bc=bowCv.getContext('2d');
let BW=0,BH=0;

function sFromX(px){let b=-1,bd=999;for(let i=0;i<4;i++){const d=Math.abs(px-strX(i));if(d<bd){bd=d;b=i;}}return bd<36?b:-1;}

bowCv.addEventListener('pointerdown',e=>{
  e.preventDefault();ensureA();
  const r=bowCv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  bow.dn=true;bow.px=px;bow.py=py;bow.lx=px;bow.lt=performance.now();
  bow.str=sFromX(px);
  if(bow.str>=0){const n=AE.play(bow.str,semi[bow.str],.25,vibManual);actS=bow.str;vib[bow.str]=.3;if(n)curN=n;mkP(bow.str,py);stats.plays++;}
});
bowCv.addEventListener('pointermove',e=>{
  e.preventDefault();if(!bow.dn)return;
  const r=bowCv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const now=performance.now(),dx=px-bow.lx,dt=Math.max(1,now-bow.lt)/1000;
  bow.spd=Math.min(1,Math.abs(dx/dt)/(BW*1.1));
  if(Math.abs(dx)>1)bow.dir=dx>0?1:-1;
  bow.px=px;bow.py=py;
  bow.angle+=((bow.dir>0?-Math.PI*.18:-Math.PI*.28)-bow.angle)*.12;
  const ns=sFromX(px);
  if(ns>=0&&ns!==bow.str){
    if(bow.str>=0){AE.stop(bow.str);vib[bow.str]*=.4;}
    bow.str=ns;const n=AE.play(ns,semi[ns],bow.spd,vibManual);actS=ns;vib[ns]=bow.spd;if(n)curN=n;mkP(ns,py);stats.plays++;
  }else if(ns>=0&&Math.abs(dx)>1){
    const n=AE.upd(ns,semi[ns],bow.spd,vibManual);vib[ns]=bow.spd;actS=ns;if(n)curN=n;
  }else if(ns<0&&bow.str>=0){AE.stop(bow.str);actS=-1;bow.str=-1;}
  bow.lx=px;bow.lt=now;
});
function bowUp(){if(!bow.dn)return;bow.dn=false;bow.spd=0;if(bow.str>=0)AE.stop(bow.str);bow.str=-1;actS=-1;curN='';}
bowCv.addEventListener('pointerup',e=>{e.preventDefault();bowUp();});
bowCv.addEventListener('pointercancel',e=>{e.preventDefault();bowUp();});
bowCv.addEventListener('pointerleave',e=>{e.preventDefault();bowUp();});

function mkP(si,y){const sx=strX(si);for(let i=0;i<7;i++)parts.push({x:sx,y,vx:(Math.random()-.5)*55,vy:(Math.random()-.5)*35-10,life:1,sz:1.2+Math.random()*2,col:SC[si]});}

/* ═══ RENDER BOW OVERLAY ═══ */
function renderBow(){
  bc.clearRect(0,0,BW,BH);
  for(let i=0;i<4;i++){
    const sx=strX(i),isA=actS===i,va=vib[i],vp=vibP[i];
    const th=[4.5,3.5,2.6,1.8][i];
    if(isA&&bow.dn){bc.save();bc.globalAlpha=.12;bc.fillStyle=SC[i];bc.fillRect(sx-22,0,44,BH);bc.restore();}
    if(va>.01){
      bc.beginPath();bc.lineWidth=th*(isA?1.5:1);bc.strokeStyle=isA?SC[i]:SD[i];
      bc.moveTo(sx,3);for(let y=4;y<BH-3;y+=2){const t=(y-3)/(BH-6);bc.lineTo(sx+Math.sin(t*Math.PI)*Math.sin(vp+t*24)*va*14,y);}
      bc.stroke();if(isA){bc.save();bc.shadowColor=SC[i];bc.shadowBlur=18;bc.stroke();bc.restore();}
    }
  }
  if(bow.dn||bow.spd>.02){
    const bpx=clamp(bow.px,15,BW-15),bpy=clamp(bow.py,25,BH-25);
    if(bow.str>=0){
      const sx=strX(bow.str);
      bc.save();const gl=bc.createRadialGradient(sx,bpy,0,sx,bpy,30);
      gl.addColorStop(0,SCA[bow.str]+'0.4)');gl.addColorStop(1,SCA[bow.str]+'0)');
      bc.fillStyle=gl;bc.fillRect(sx-40,bpy-40,80,80);bc.restore();
      bc.save();bc.globalAlpha=.4;bc.strokeStyle='rgba(255,255,240,.55)';bc.lineWidth=2.5;bc.lineCap='round';
      bc.beginPath();bc.moveTo(sx-16,bpy);bc.lineTo(sx+16,bpy);bc.stroke();bc.restore();
    }
    bc.save();bc.translate(bpx,bpy);bc.rotate(bow.angle);
    const half=Math.min(BW*.52,175)/2;
    bc.strokeStyle=bow.dn?'rgba(255,255,240,.4)':'rgba(255,255,240,.1)';bc.lineWidth=bow.dn?2.5:1.5;bc.lineCap='round';
    bc.beginPath();bc.moveTo(-half,2);bc.lineTo(half,2);bc.stroke();
    bc.beginPath();bc.moveTo(-half,-2.5);bc.quadraticCurveTo(0,-5.5,half,-2.5);bc.lineTo(half,-.5);bc.quadraticCurveTo(0,-3.5,-half,-.5);bc.closePath();
    const sg=bc.createLinearGradient(-half,0,half,0);
    sg.addColorStop(0,'#3d2010');sg.addColorStop(.08,'#7a5230');sg.addColorStop(.35,bow.dn?'#a87848':'#8b6240');
    sg.addColorStop(.65,bow.dn?'#b8905a':'#8b6240');sg.addColorStop(.92,'#7a5230');sg.addColorStop(1,'#3d2010');
    bc.fillStyle=sg;bc.fill();
    if(bow.dn){bc.save();bc.shadowColor='rgba(180,150,100,.2)';bc.shadowBlur=6;bc.fill();bc.restore();}
    bc.fillStyle='#888';for(let w=0;w<3;w++)bc.fillRect(half-26-w*5,-4,2,5);
    bc.fillStyle='#111';rr(bc,half-3,-6.5,17,13,3);bc.fill();
    bc.strokeStyle='#444';bc.lineWidth=.6;rr(bc,half-3,-6.5,17,13,3);bc.stroke();
    bc.beginPath();bc.arc(half+6,0,2.5,0,Math.PI*2);const pg=bc.createRadialGradient(half+5,-1,0,half+6,0,2.5);
    pg.addColorStop(0,'#f0e4cc');pg.addColorStop(1,'#a08050');bc.fillStyle=pg;bc.fill();
    bc.beginPath();bc.arc(half+13,0,1.8,0,Math.PI*2);bc.fillStyle='#555';bc.fill();
    bc.fillStyle='#ece0c8';rr(bc,-half-7,-3.5,10,7,2);bc.fill();
    bc.fillStyle='#1a1a1a';bc.fillRect(-half-7,-.5,2.5,1.5);
    bc.restore();
  }
  for(const p of parts){bc.globalAlpha=p.life;bc.fillStyle=p.col;bc.beginPath();bc.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);bc.fill();}
  bc.globalAlpha=1;
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ═══ RESIZE ═══ */
function resize(){
  dpr=devicePixelRatio||1;
  const appR=document.getElementById('app').getBoundingClientRect();
  totalW=appR.width;totalH=appR.height;
  osW=document.getElementById('osCol').getBoundingClientRect().width;
  bgCv.width=totalW*dpr;bgCv.height=totalH*dpr;bgCv.style.width=totalW+'px';bgCv.style.height=totalH+'px';
  bg.setTransform(dpr,0,0,dpr,0,0);
  const hdH=document.getElementById('hd').getBoundingClientRect().height;
  const tbH=document.getElementById('tb').getBoundingClientRect().height;
  const fbH=document.getElementById('fb').getBoundingClientRect().height;
  fbTop=hdH+tbH;fbBot=fbTop+fbH;
  drawBG();
  const bR=bowCv.parentElement.getBoundingClientRect();
  BW=bR.width;BH=bR.height;
  bowCv.width=BW*dpr;bowCv.height=BH*dpr;bowCv.style.width=BW+'px';bowCv.style.height=BH+'px';
  bc.setTransform(dpr,0,0,dpr,0,0);
}

    [2,5,1],[2,3,1],[2,3,1],[2,2,1],[2,2,1],[2,5,3]
  ]},
  {name:'Mary Had a Little Lamb',bpm:112,notes:[
    [2,4,1],[2,2,1],[2,0,1],[2,2,1],[2,4,1],[2,4,1],[2,4,2],
    [2,2,1],[2,2,1],[2,2,2],[2,4,1],[2,7,1],[2,7,2],
    [2,4,1],[2,2,1],[2,0,1],[2,2,1],[2,4,1],[2,4,1],[2,4,1],[2,4,1],
    [2,2,1],[2,2,1],[2,4,1],[2,2,1],[2,0,4]
  ]}
];
let songIdx=0;

function loadSong(i){
  songIdx=((i%SONGS.length)+SONGS.length)%SONGS.length;
  const s=SONGS[songIdx];
  songState={name:s.name,bpm:s.bpm,notes:s.notes.slice(),
    idx:0,startT:0,score:0,streak:0,hits:0,miss:0,total:s.notes.length,running:false};
  document.getElementById('songTitle').textContent=s.name+' ♩='+s.bpm;
  document.getElementById('ssScore').textContent='0';
  document.getElementById('songStreak').textContent='0';
  document.getElementById('ssAcc').textContent='100%';
}
function songStart(){
  if(!songState)loadSong(0);
  songState.idx=0;songState.startT=performance.now();songState.score=0;
  songState.streak=0;songState.hits=0;songState.miss=0;songState.running=true;
}
function songNoteAbsBeat(n,idx){
  // cumulative beat start
  let t=0;for(let i=0;i<idx;i++)t+=n[i][2];return t;
}
function songTryHit(si,sm){
  if(!songState||!songState.running)return;
  // window: expected note index based on time; accept ±1 note window
  const beatDur=60000/songState.bpm;
  const elapsed=(performance.now()-songState.startT)/beatDur;
  // find nearest pending note
  let best=-1,bd=99;
  for(let i=Math.max(0,songState.idx-1);i<Math.min(songState.notes.length,songState.idx+2);i++){
    const tb=songNoteAbsBeat(songState.notes,i);
    const d=Math.abs(tb-elapsed);
    if(d<bd){bd=d;best=i;}
  }
  if(best<0)return;
  const n=songState.notes[best];
  const matchStr=(n[0]===si);
  const matchFret=(n[1]===sm);
  if(matchStr&&matchFret&&bd<1.2){
    songState.hits++;songState.streak++;
    const pts=Math.max(50,Math.round(200-bd*100));
    songState.score+=pts;
    if(songState.streak>stats.curStreak)stats.curStreak=songState.streak;
    if(stats.curStreak>stats.bestStreak)stats.bestStreak=stats.curStreak;
    if(best>=songState.idx)songState.idx=best+1;
    flashHit(true);
  } else if(bd<1.5){
    songState.miss++;songState.streak=0;flashHit(false);
  }
  updateSongHud();
}
function updateSongHud(){
  if(!songState)return;
  document.getElementById('ssScore').textContent=songState.score;
  document.getElementById('songStreak').textContent=songState.streak;
  const tot=songState.hits+songState.miss;
  const acc=tot?Math.round(songState.hits/tot*100):100;
  document.getElementById('ssAcc').textContent=acc+'%';
}
let hitFlash=0,hitFlashOk=true;
function flashHit(ok){hitFlash=1;hitFlashOk=ok;}

/* ═══ SONG — falling-notes renderer (draws onto bowCv overlay) ═══ */
function renderSong(dt){
  if(!songState)return;
  const beatDur=60/songState.bpm; // seconds
  const elapsed=songState.running?(performance.now()-songState.startT)/1000:0;
  const lookAhead=3.2; // seconds of notes visible
  // Target line = bottom strike zone
  const strikeY=BH-40;
  const topY=14;
  const span=strikeY-topY;
  bc.save();
  // Strike line
  bc.strokeStyle='rgba(255,215,0,.55)';bc.lineWidth=2;
  bc.setLineDash([6,4]);bc.beginPath();bc.moveTo(osW,strikeY);bc.lineTo(BW-4,strikeY);bc.stroke();
  bc.setLineDash([]);
  // Draw each note as a falling pill
  let cum=0;
  for(let i=0;i<songState.notes.length;i++){
    const n=songState.notes[i];
    const noteBeatStart=cum;
    cum+=n[2];
    const secsUntil=noteBeatStart*beatDur-elapsed;
    if(secsUntil>lookAhead||secsUntil<-.6)continue;
    const prog=1-secsUntil/lookAhead; // 0..1 as it approaches strike
    const y=topY+span*prog;
    const sx=strX(n[0]);
    const w=42,h=18+Math.min(40,n[2]*16);
    // pill
    bc.save();
    bc.globalAlpha=Math.max(.22,Math.min(1,prog*1.2));
    const col=SC[n[0]];
    bc.fillStyle=col;
    rr(bc,sx-w/2,y-h/2,w,h,8);bc.fill();
    bc.strokeStyle='rgba(255,255,255,.5)';bc.lineWidth=1.2;bc.stroke();
    bc.fillStyle='rgba(0,0,0,.55)';bc.font='bold 10px Georgia';bc.textAlign='center';bc.textBaseline='middle';
    bc.fillText(AE.nn(AE.freq(n[0],n[1])),sx,y);
    bc.restore();
  }
  // auto-miss pass: advance idx if a note has passed
  if(songState.running){
    const ebeat=elapsed/beatDur;
    let acc=0;
    for(let i=0;i<songState.notes.length;i++){
      const nb=acc;acc+=songState.notes[i][2];
      if(nb<ebeat-1.3&&i>=songState.idx){
        songState.miss++;songState.streak=0;
        songState.idx=i+1;updateSongHud();
      }
    }
    if(songState.idx>=songState.notes.length){songState.running=false;toast('SONG COMPLETE! '+songState.score+' pts');saveState();}
  }
  // hit flash
  if(hitFlash>0){
    bc.save();bc.globalAlpha=hitFlash*.5;
    bc.fillStyle=hitFlashOk?'rgba(80,255,120,1)':'rgba(255,80,80,1)';
    bc.fillRect(0,strikeY-4,BW,8);bc.restore();
    hitFlash=Math.max(0,hitFlash-dt*3);
  }
  bc.restore();
}

/* ═══ METRONOME ═══ */
function metroTick(){
  if(!metroOn||!audioOn)return;
  const now=performance.now();
  if(now>=metroNextT){
    AE.click(metroBeat===0);
    metroBeat=(metroBeat+1)%4;
    metroNextT=now+60000/metroBPM;
  }
}

/* ═══ TUNER ═══ */
function buildTunerRow(){
  const row=document.getElementById('tunerRow');
  row.innerHTML='';
  const hzList=[196,293.66,440,659.25];
  const names=['G3','D4','A4','E5'];
  for(let i=0;i<4;i++){
    const b=document.createElement('div');b.className='tunerBtn';
    b.style.borderColor=SC[i];b.style.color=SC[i];
    b.innerHTML=names[i]+'<div class="hz">'+Math.round(hzList[i]*100)/100+' Hz</div>';
    b.addEventListener('pointerdown',e=>{e.preventDefault();ensureA();
      AE.tone(hzList[i],1800);
      document.getElementById('tunerNote').textContent=names[i];
      document.getElementById('tunerNote').style.color=SC[i];
      document.getElementById('tunerCents').textContent='reference tone playing…';
    });
    row.appendChild(b);
  }
}

/* ═══ TOAST ═══ */
let toastTid=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  if(toastTid)clearTimeout(toastTid);
  toastTid=setTimeout(()=>t.classList.remove('on'),1800);
}

/* ═══ MODE SWITCHER ═══ */
function setMode(newMode){
  mode=newMode;
  ['btnFree','btnSong','btnTuner'].forEach(id=>document.getElementById(id).classList.remove('on'));
  if(mode==='freeplay')document.getElementById('btnFree').classList.add('on');
  if(mode==='song')document.getElementById('btnSong').classList.add('on');
  if(mode==='tuner')document.getElementById('btnTuner').classList.add('on');
  document.getElementById('modeLabel').textContent=
    mode==='freeplay'?'FreePlay':mode==='song'?'Song':'Tuner';
  const songHud=document.getElementById('songHud');
  const tunerHud=document.getElementById('tunerHud');
  songHud.classList.toggle('H',mode!=='song');
  tunerHud.classList.toggle('on',mode==='tuner');
  AE.stopAll&&AE.stopAll();
  if(mode==='song'){
    if(!songState)loadSong(0);
    songStart();
    toast('♪ '+songState.name);
  } else if(mode==='tuner'){
    toast('TUNE UP — tap a string');
  } else {
    toast('FREE PLAY');
  }
}

/* ═══ VOLUME / SETTINGS ═══ */
let masterVol=.55;
function setVol(v){
  masterVol=Math.max(0,Math.min(1,v));
  if(audioOn&&AE.setMaster)AE.setMaster(masterVol);
  document.getElementById('setVol').textContent=Math.round(masterVol*100)+'%';
}

/* ═══ SAVE / LOAD ═══ */
function saveState(){
  try{
    localStorage.setItem('violin.v2',JSON.stringify({
      masterVol, metroBPM, vibManual, songIdx,
      stats:{plays:stats.plays,bestStreak:stats.bestStreak}
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem('violin.v2');
    if(!raw)return;
    const d=JSON.parse(raw);
    if(typeof d.masterVol==='number')masterVol=d.masterVol;
    if(typeof d.metroBPM==='number')metroBPM=d.metroBPM;
    if(typeof d.vibManual==='number')vibManual=d.vibManual;
    if(typeof d.songIdx==='number')songIdx=d.songIdx;
    if(d.stats){stats.plays=d.stats.plays||0;stats.bestStreak=d.stats.bestStreak||0;}
  }catch(e){}
}

/* ═══ LOOP ═══ */
let lt=performance.now();
function frame(ts){
  const dt=Math.min(.05,(ts-lt)/1000);lt=ts;
  for(let i=0;i<4;i++){
    if(actS===i&&bow.dn){vib[i]+=(bow.spd-vib[i])*dt*12;vibP[i]+=dt*48;}
    else{vib[i]*=Math.max(0,1-dt*6);if(vib[i]<.004)vib[i]=0;vibP[i]+=dt*48*vib[i];}
  }
  if(!bow.dn)bow.spd*=Math.max(0,1-dt*10);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.life-=dt*2.8;if(p.life<=0)parts.splice(i,1);}
  renderBow();
  if(mode==='song')renderSong(dt);
  metroTick();
  document.getElementById('nd').textContent=bow.dn&&curN?curN:'';
  document.getElementById('tbStats').textContent='♪ '+stats.plays+(stats.bestStreak>0?'  ★'+stats.bestStreak:'');
  requestAnimationFrame(frame);
}

/* ═══ TOOLBAR WIRING ═══ */
function wireToolbar(){
  document.getElementById('btnFree').addEventListener('pointerdown',e=>{e.preventDefault();ensureA();setMode('freeplay');});
  document.getElementById('btnSong').addEventListener('pointerdown',e=>{e.preventDefault();ensureA();setMode('song');});
  document.getElementById('btnTuner').addEventListener('pointerdown',e=>{e.preventDefault();ensureA();setMode('tuner');});
  document.getElementById('btnVib').addEventListener('pointerdown',e=>{
    e.preventDefault();ensureA();
    vibManual=vibManual>0?0:.55;
    document.getElementById('btnVib').classList.toggle('on',vibManual>0);
    document.getElementById('setVib').textContent=vibManual>0?'on':'off';
    saveState();
  });
  document.getElementById('btnMetro').addEventListener('pointerdown',e=>{
    e.preventDefault();ensureA();
    metroOn=!metroOn;
    metroBeat=0;metroNextT=performance.now();
    document.getElementById('btnMetro').classList.toggle('on',metroOn);
    toast(metroOn?'Metronome ON':'Metronome OFF');
  });
  document.getElementById('btnBpmDn').addEventListener('pointerdown',e=>{
    e.preventDefault();metroBPM=Math.max(40,metroBPM-4);
    document.getElementById('bpmVal').textContent=metroBPM;
    document.getElementById('setBpm').textContent=metroBPM;saveState();
  });
  document.getElementById('btnBpmUp').addEventListener('pointerdown',e=>{
    e.preventDefault();metroBPM=Math.min(220,metroBPM+4);
    document.getElementById('bpmVal').textContent=metroBPM;
    document.getElementById('setBpm').textContent=metroBPM;saveState();
  });
  document.getElementById('btnSet').addEventListener('pointerdown',e=>{
    e.preventDefault();document.getElementById('setP').classList.toggle('on');refreshSettings();
  });
  document.getElementById('btnVolDn').addEventListener('pointerdown',e=>{e.preventDefault();setVol(masterVol-.1);saveState();});
  document.getElementById('btnVolUp').addEventListener('pointerdown',e=>{e.preventDefault();setVol(masterVol+.1);saveState();});
  document.getElementById('btnReset').addEventListener('pointerdown',e=>{
    e.preventDefault();
    stats.plays=0;stats.bestStreak=0;stats.curStreak=0;
    masterVol=.55;metroBPM=90;vibManual=0;
    document.getElementById('bpmVal').textContent=metroBPM;
    document.getElementById('btnVib').classList.remove('on');
    setVol(masterVol);refreshSettings();saveState();toast('Reset');
  });
  // Song picker — long-press SONG button cycles next song
  let songPressT=0;
  document.getElementById('btnSong').addEventListener('pointerdown',()=>{songPressT=performance.now();});
  document.getElementById('btnSong').addEventListener('pointerup',()=>{
    if(performance.now()-songPressT>500&&mode==='song'){
      loadSong(songIdx+1);songStart();toast('♪ '+songState.name);saveState();
    }
  });
}
function refreshSettings(){
  document.getElementById('setVol').textContent=Math.round(masterVol*100)+'%';
  document.getElementById('setBpm').textContent=metroBPM;
  document.getElementById('setVib').textContent=vibManual>0?'on':'off';
  document.getElementById('setPlays').textContent=stats.plays;
  document.getElementById('setStreak').textContent=stats.bestStreak;
}

/* ═══ INIT ═══ */
function ensureA(){
  if(!audioOn){
    AE.init();audioOn=true;
    AE.setMaster(masterVol);
    document.getElementById('ov').classList.add('H');
  }
  AE.res();
}
document.getElementById('ov').addEventListener('pointerdown',e=>{e.preventDefault();ensureA();});
loadState();
buildFB();buildOS();buildTunerRow();wireToolbar();
document.getElementById('bpmVal').textContent=metroBPM;
if(vibManual>0)document.getElementById('btnVib').classList.add('on');
requestAnimationFrame(()=>{resize();requestAnimationFrame(frame);});
window.addEventListener('resize',resize);
window.addEventListener('beforeunload',saveState);
</script>
